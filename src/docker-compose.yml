version: '3.8'

services:
  nitro-schema-api:
    image: nitro-schema-api
    build:
      context: .
      dockerfile: NitroSchemaApi/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__postgres=Host=postgres;Port=5432;Database=orders;Username=postgres;Password=postgres
      - NITRO_ADMIN_TOKEN=dev-token
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    image: gateway
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - NITRO_SCHEMA_WS=ws://nitro-schema-api:8080/ws
      - NITRO_ADMIN_TOKEN=dev-token
    depends_on:
      - nitro-schema-api
      - products
      - reviews
      - shipping
      - orders

  products:
    image: products
    build:
      context: .
      dockerfile: ProductsService/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080

  reviews:
    image: reviews
    build:
      context: .
      dockerfile: ReviewsService/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080

  shipping:
    image: shipping
    build:
      context: .
      dockerfile: ShippingService/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080

  orders:
    image: orders
    build:
      context: .
      dockerfile: OrdersService/Dockerfile
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__postgres=Host=postgres;Port=5432;Database=orders;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy

  backoffice:
    image: backoffice
    build:
      context: .
      dockerfile: BackOfficeService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__postgres=Host=postgres;Port=5432;Database=orders;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
      orders:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=orders
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orders"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    image: frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "4999:80"
    environment:
      - GRAPHQL_HTTP=http://localhost:5000/graphql
      - GRAPHQL_WS=ws://localhost:5000/graphql

volumes:
  postgres_data:

