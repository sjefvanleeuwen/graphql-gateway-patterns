version: '3.8'

services:
  gateway:
    image: gateway
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    depends_on:
      - products
      - reviews
      - shipping
      - orders

  products:
    image: products
    build:
      context: .
      dockerfile: ProductsService/Dockerfile
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080

  reviews:
    image: reviews
    build:
      context: .
      dockerfile: ReviewsService/Dockerfile
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080

  shipping:
    image: shipping
    build:
      context: .
      dockerfile: ShippingService/Dockerfile
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080

  orders:
    image: orders
    build:
      context: .
      dockerfile: OrdersService/Dockerfile
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__postgres=Host=postgres;Port=5432;Database=orders;Username=postgres;Password=postgres
    depends_on:
      - postgres

  backoffice:
    image: backoffice
    build:
      context: .
      dockerfile: BackOfficeService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__postgres=Host=postgres;Port=5432;Database=orders;Username=postgres;Password=postgres
    depends_on:
      - postgres
      - orders

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=orders
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:
    image: frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "4999:80"
    environment:
      - GRAPHQL_HTTP=http://localhost:5000/graphql
      - GRAPHQL_WS=ws://localhost:5000/graphql

volumes:
  postgres_data:

